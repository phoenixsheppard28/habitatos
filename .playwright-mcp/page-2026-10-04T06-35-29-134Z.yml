            - paragraph [ref=f3e311]:
              - text: I analyzed daily displacement for 2011-02-01 to 2011-03-31. The time-series line chart, "Daily median displacement", is in the
              - strong [ref=f3e312]: Charts tab
              - text: .
            - paragraph [ref=f3e313]:
              - strong [ref=f3e314]: Overall result (animal-days)
            - list [ref=f3e315]:
              - listitem [ref=f3e316]:
                - strong [ref=f3e317]: "Valid values:"
                - text: 550 animal-day displacements. A further 11 of the 561 rows had no value and were excluded, not treated as zero.
              - listitem [ref=f3e318]:
                - strong [ref=f3e319]: "Mean:"
                - text: 1.03 km per day.
              - listitem [ref=f3e320]:
                - strong [ref=f3e321]: "Median:"
                - text: 0.50 km per day.
              - listitem [ref=f3e322]:
                - strong [ref=f3e323]: "Spread:"
                - text: SD 1.38 km, interquartile range 0.20–1.30 km, range 0.001–12.36 km. The mean is above the median because a few long-distance days skew the distribution.
            - paragraph [ref=f3e324]:
              - strong [ref=f3e325]: Pattern in the chart
              - text: The chart line is the median across animals for each day.
            - list [ref=f3e326]:
              - listitem [ref=f3e327]:
                - strong [ref=f3e328]: "February:"
                - text: daily medians are mostly 0.3–1.4 km. The highest are 2.11 km on Feb 7, 1.41 km on Feb 8 and 1.37 km on Feb 5.
              - listitem [ref=f3e329]:
                - strong [ref=f3e330]: "March:"
                - text: medians are generally lower, mostly below 0.8 km. There is one spike of 4.01 km on Mar 11.
              - listitem [ref=f3e331]:
                - strong [ref=f3e332]: "End of March:"
                - text: medians fall to about 0.13–0.21 km on Mar 29–31.
              - listitem [ref=f3e333]:
                - strong [ref=f3e334]: "Mar 8–9:"
                - text: these dates are absent from the series.
              - listitem [ref=f3e335]:
                - strong [ref=f3e336]: "Mar 10:"
                - text: it has no value.
            - paragraph [ref=f3e337]: I can't tell from this analysis what caused any of these changes. No rainfall or vegetation data was used.
