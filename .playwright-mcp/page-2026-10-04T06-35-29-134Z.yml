            - list [ref=f3e357]:
              - listitem [ref=f3e358]:
                - strong [ref=f3e359]: "Records:"
                - text: the window holds 561 animal-day records from 11 tracked animals. That is 305 in February and 256 in March, matching the monthly summary. The monthly summary also shows 4,678 raw fixes in February and 3,825 in March.
              - listitem [ref=f3e360]:
                - strong [ref=f3e361]: "Daily grain:"
                - text: each animal-day uses the last good fix of each UTC day. Displacement is measured between those daily fixes. It is not the total distance travelled within a day.
              - listitem [ref=f3e362]:
                - strong [ref=f3e363]: "Chart values:"
                - text: each chart point is a median across animals, so it doesn't show differences between individuals. March has fewer records (256 versus 305).
              - listitem [ref=f3e364]:
                - strong [ref=f3e365]: "Missing data:"
                - text: missing days or values are missing evidence, not zero movement.
              - listitem [ref=f3e366]:
                - strong [ref=f3e367]: "Scope:"
                - text: the results describe these collared animals only. They are not a population estimate.
