[project]
name = "habitat"
version = "0.1.0"
description = "Habitat Watch: fetch, archive, normalize, catalog, search, recipe feature preparation, analysis and query coordination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=18",
    "pydantic>=2.10,<3",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "python-dotenv>=1.0",
    "rasterio>=1.4",
    "scikit-learn>=1.4",
    "shapely>=2.0,<3",
]

[project.scripts]
habitat = "habitat.pipeline:main"
habitat-web = "habitat.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habitat", "src/recipe", "src/analysis", "src/workflow", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real remote services; runs only when HABITAT_LIVE_TESTS=1"]
