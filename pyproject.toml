[project]
name = "habitat"
version = "0.1.0"
description = "Habitat Watch data pipeline: fetch, normalize, catalog and search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "python-dotenv>=1.0",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habitat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
