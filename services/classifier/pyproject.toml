[project]
name = "habitat-classifier"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "gliclass==0.1.10",
    "sentencepiece==0.2.1",
    "torch==2.10.0",
    "transformers==4.48.2",
    "uvicorn==0.34.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
